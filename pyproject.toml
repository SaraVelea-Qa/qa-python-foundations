[project]
name = "qa-python-foundations"
version = "0.1.0"
description = "Python foundations for test automation: exercises, katas and tests"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
